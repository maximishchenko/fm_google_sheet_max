[project]
name = "google_sheet_max"
version = "0.1.0"
description = "Foura Mebel Apps"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[project.scripts]
google-sheet-max = "google_sheet_max.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_sheet_max"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "commitizen==2.42.1",
    "coverage>=7.2.7",
    "nuitka>=2.6",
    "pre-commit>=2.21.0",
    "ruff>=0.16.3",
    "vulture>=2.16",
]


[tool.ruff]
fix = true

exclude = [
    '.git',
    '.venv',
    '__pycache__',
    '.ruff_cache',
    '.mypy_cache',
]

line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "N", # PEP8 naming
    "B", # flake8-bugbear
    "D", # pydocstyle
    "C4", # flake8-comprehensions
    "RUF", # ruff specific rules
]

ignore = [
    "C408",   # Ненужный вызов dict, list и т.д.
    "RUF001", # Игнорирование похожих символов с разными ASCII
    "RUF002", # Игнорирование похожих символов с разными ASCII
    "RUF003", # Игнорирование похожих символов с разными ASCII
    "RUF100",
    "S110",   # try-except-pass
    "D203",   # Требует пустую строку перед классом (конфликтует с D211)
    "D212",   # Требует начинать многострочное описание на первой строке (конфликтует с D213)
    "D213",
]

[tool.ruff.lint.isort]
known-first-party = ["google_sheet_max"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D1",   # docstrings в тестах не требуются — названия методов говорят сами
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true


explicit_package_bases = true
namespace_packages = true
mypy_path = "src"


exclude = [
    '.venv',
]

[tool.coverage.run]
source = ["src/google_sheet_max"]
omit = [
    "tests/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
